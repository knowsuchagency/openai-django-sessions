[project]
name = "openai-django-sessions"
version = "0.2.0"
description = "Django ORM-based session backend for OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "openai-agents>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_django_sessions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
